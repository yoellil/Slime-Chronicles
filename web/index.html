<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1113" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Chronicles of Reincarnation: an incremental RPG about a nameless slime who grows into the founder of a nation." />
    <title>Chronicles of Reincarnation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      <section class="boot">
        <div class="boot-orb"></div>
        <p>The record is opening</p>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script src="/art.js"></script>
